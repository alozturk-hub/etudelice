                <p class="text-red-600">Erreur lors du chargement des réservations</p>
            </div>
        </div>
    </main>

<script>
// variables globales
let currentUserId = null;

// session
function checkSession() {
    fetch('controller/checkSession.php')
        .then(res => res.json())
        .then(data => {
            if (data.logged_in) {
                currentUserId = data.user_id;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('userFullName').textContent = data.user_prenom + ' ' + data.user_nom;
                document.getElementById('userEmail').textContent = data.user_mail;
            }
        });
}

// logout
function logout(e) {
    e.preventDefault();
    fetch('controller/logout.php').then(() => location.reload());
}

// load
async function chargerReservations() {
    try {
        const res = await fetch('controller/getCommandeController.php');
        const result = await res.json();

        if (result.success && result.data.length > 0) {
            afficherReservations(result.data);
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('reservationsContainer').classList.remove('hidden');
        } else {
            afficherErreur("Aucune réservation trouvée");
        }
    } catch {
        afficherErreur("Erreur serveur");
    }
}

// affichage
function afficherReservations(data) {
    const container = document.getElementById('reservationsContainer');
    const count = document.getElementById('reservationsCount');

    count.textContent = data.length;
    container.innerHTML = '';

    data.forEach(r => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm p-6';

        card.innerHTML = `
            <h3 class="text-lg font-bold mb-2">Réservation #${r.reservation_id}</h3>
            <p>📅 ${r.reservation_date}</p>
            <p>📌 ${r.reservation_statut}</p>
            <p>👨‍🍳 user_id_1 : ${r.user_id_1}</p>
        `;

        container.appendChild(card);
    });
}

// erreur
function afficherErreur(msg) {
    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('errorState').classList.remove('hidden');
    document.getElementById('errorState').innerHTML = `<p class="text-red-600">${msg}</p>`;
}

// init
document.addEventListener('DOMContentLoaded', () => {
    checkSession();
    chargerReservations();
});
</script>
