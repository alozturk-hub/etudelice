<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - Étudélice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <main class="max-w-2xl mx-auto px-4 py-16">
        <a href="index.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-emerald-600 transition-colors mb-8">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Retour à l’accueil
        </a>

        <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-900 mb-3">Choisir un nouveau mot de passe</h1>
            <p id="tokenInfo" class="text-gray-600 mb-8">Vérification du lien en cours…</p>

            <form id="resetPasswordForm" class="space-y-5 hidden">
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Nouveau mot de passe *</label>
                    <input type="password" id="password" minlength="8" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                        placeholder="8 caractères minimum">
                </div>
                <div>
                    <label for="passwordConfirm" class="block text-sm font-semibold text-gray-700 mb-2">Confirmer le mot de passe *</label>
                    <input type="password" id="passwordConfirm" minlength="8" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                        placeholder="Retapez le mot de passe">
                </div>
                <div id="resetPasswordMessage" class="hidden p-4 rounded-lg text-sm"></div>
                <div class="flex justify-end">
                    <button type="submit"
                        class="px-6 py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors font-semibold">
                        Mettre à jour le mot de passe
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        function showMessage(message, success) {
            const box = document.getElementById('resetPasswordMessage');
            box.textContent = message;
            box.className = success
                ? 'p-4 rounded-lg text-sm bg-green-50 border border-green-200 text-green-700'
                : 'p-4 rounded-lg text-sm bg-red-50 border border-red-200 text-red-700';
            box.classList.remove('hidden');
        }

        async function validateToken() {
            const info = document.getElementById('tokenInfo');
            const form = document.getElementById('resetPasswordForm');

            if (!token) {
                info.textContent = 'Lien invalide : jeton manquant.';
                return;
            }

            try {
                const response = await fetch(`controller/resetPasswordController.php?token=${encodeURIComponent(token)}`);
                const result = await response.json();

                if (!result.success) {
                    info.textContent = result.message;
                    return;
                }

                info.textContent = `Lien valide pour ${result.user_mail}. Vous pouvez maintenant choisir un nouveau mot de passe.`;
                form.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                info.textContent = 'Une erreur est survenue lors de la vérification du lien.';
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            try {
                const response = await fetch('controller/resetPasswordController.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        password,
                        password_confirm: passwordConfirm
                    })
                });

                const result = await response.json();
                showMessage(result.message, result.success);

                if (result.success) {
                    setTimeout(() => {
                        window.location.href = result.redirect || 'index.html';
                    }, 1500);
                }
            } catch (error) {
                console.error(error);
                showMessage('Une erreur est survenue lors de la réinitialisation.', false);
            }
        });

        validateToken();
    </script>
</body>
</html>
