<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Étudélice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <main class="max-w-2xl mx-auto px-4 py-16">
        <a href="index.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-emerald-600 transition-colors mb-8">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Retour à l’accueil
        </a>

        <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-900 mb-3">Mot de passe oublié</h1>
            <p class="text-gray-600 mb-8">
                Entrez l’adresse email associée à votre compte client ou cuisinier. Nous préparerons un lien pour choisir un nouveau mot de passe.
            </p>

            <form id="forgotPasswordForm" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Adresse email *</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                        placeholder="jean.dupont@exemple.fr">
                </div>

                <div id="forgotPasswordMessage" class="hidden p-4 rounded-lg text-sm"></div>
                <div id="resetLinkContainer" class="hidden p-4 rounded-lg text-sm bg-amber-50 border border-amber-200 text-amber-800"></div>

                <div class="flex justify-end">
                    <button type="submit"
                        class="px-6 py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors font-semibold">
                        Envoyer le lien
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function showMessage(message, success) {
            const box = document.getElementById('forgotPasswordMessage');
            box.textContent = message;
            box.className = success
                ? 'p-4 rounded-lg text-sm bg-green-50 border border-green-200 text-green-700'
                : 'p-4 rounded-lg text-sm bg-red-50 border border-red-200 text-red-700';
            box.classList.remove('hidden');
        }

        document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const resetLinkContainer = document.getElementById('resetLinkContainer');
            resetLinkContainer.classList.add('hidden');
            resetLinkContainer.innerHTML = '';

            try {
                const response = await fetch('controller/requestPasswordResetController.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json();
                showMessage(result.message, result.success);

                if (result.reset_link) {
                    resetLinkContainer.innerHTML = `Lien local de test : <a href="${result.reset_link}" class="underline font-semibold hover:text-amber-900">${result.reset_link}</a>`;
                    resetLinkContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                showMessage('Une erreur est survenue lors de la demande de réinitialisation.', false);
            }
        });
    </script>
</body>
</html>
